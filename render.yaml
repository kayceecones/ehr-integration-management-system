services:
  - type: web
    name: ehr-integration-management-system
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ehr-access-registry
          property: connectionString
      - key: CHPL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY   # only for `npm run extract`; the server itself does not call Claude
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DATA_SOURCE_ID
        sync: false

  # No scheduled cron. Deadline classification runs on demand: POST /jobs/clocks
  # on the web service, or `npm run clocks` locally. It also runs automatically
  # whenever a date is recorded via POST /requests/:id/dates, and GET /requests
  # recomputes clocks live on every read.

databases:
  - name: ehr-access-registry
    plan: free
    postgresMajorVersion: "16"
